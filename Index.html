<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Buat kamu, 10 November 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#2b1233;--bg2:#5a1f48;--glow:#ff8aa8;--peach:#ffd0b0;--ink:#fff3ee;--soft:#e9c3d4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(120% 90% at 50% 100%,var(--bg2),var(--bg1) 70%);color:var(--ink);font-family:"Quicksand",system-ui,sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
main{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 28px}
.stage{max-width:520px;width:100%;min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.line{font-family:"Caveat",cursive;font-weight:500;font-size:clamp(30px,8.2vw,46px);line-height:1.25;text-wrap:balance;text-shadow:0 0 28px rgba(255,138,168,.35)}
.line b{font-weight:700;color:var(--peach)}
.date{font-size:15px;color:var(--soft);letter-spacing:.04em;margin-bottom:-14px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.next{background:none;color:var(--soft);font-size:15px;padding:12px 22px;border-radius:99px;border:1px solid rgba(255,200,220,.35);transition:.2s;opacity:0}
.next.on{opacity:1}
.next:hover,.next:focus-visible{background:rgba(255,255,255,.1);outline:none}
.seal{width:132px;height:132px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb3c6,#e0446f 70%);box-shadow:0 0 0 10px rgba(255,138,168,.14),0 0 60px rgba(255,100,150,.6);font-size:54px;animation:beat 1.6s ease-in-out infinite}
.seal:focus-visible{outline:3px solid var(--peach);outline-offset:8px}
@keyframes beat{0%,100%{transform:scale(1)}18%{transform:scale(1.09)}36%{transform:scale(1)}54%{transform:scale(1.06)}}
.hint{font-size:15px;color:var(--soft)}
.ask{display:none;flex-direction:column;align-items:center;gap:26px}
.btns{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap;min-height:64px}
.yes{background:linear-gradient(135deg,#ff7fa0,#ff5a86);padding:16px 36px;border-radius:99px;font-weight:600;font-size:18px;box-shadow:0 8px 30px rgba(255,90,134,.5);transition:transform .2s}
.yes:hover{transform:scale(1.06)}
.yes:focus-visible,.no:focus-visible{outline:3px solid var(--peach);outline-offset:4px}
.no{background:rgba(255,255,255,.1);padding:14px 24px;border-radius:99px;font-size:16px;color:var(--soft);transition:left .25s,top .25s}
.fin{display:none}
.show{display:flex}
@media (prefers-reduced-motion:reduce){.seal{animation:none}}

.polaroid{width:min(58vw,230px);aspect-ratio:4/5;background:#fff8f4;padding:9px 9px 30px;border-radius:3px;box-shadow:0 14px 40px rgba(0,0,0,.45);transform:rotate(-3deg);margin-bottom:-6px}
.polaroid.r{transform:rotate(2.5deg)}
.polaroid img,.polaroid video{width:100%;height:100%;object-fit:cover;display:block;border-radius:1px}
.mute{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));right:14px;z-index:5;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.12);font-size:18px;display:none}
.mute:focus-visible{outline:3px solid var(--peach)}
main{overflow-y:auto;overflow-x:hidden;justify-content:safe center}
.strip{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;width:100vw;padding:18px 20vw 26px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip .polaroid{flex:0 0 auto;scroll-snap-align:center;margin:0;width:min(62vw,250px)}
.swipe{font-size:15px;color:var(--soft);margin-top:-14px}
.line{font-size:clamp(28px,7.4vw,42px)}
</style>
</head>

const slides=[
 {p:"a",d:"10 November 2026",t:"Hari ini hari ulang tahunmu.<br>Sekaligus Hari Pahlawan, dan kamu <b>pahlawan kecilku</b> yang spesial."},
 {p:"b",t:"Sebenarnya aku udah lama banget mau ngungkapin sesuatu ke kamu."},
 {p:"c",t:"Aku <b>nyaman</b> sama kamu.<br>Ini dari hatiku yang paling tulus."},
 {p:"d",t:"Aku pengen seserius itu sama perasaanku ini."}
];
const $=id=>document.getElementById(id);
const stage=$('stage'),nextB=$('next');
let i=-1,busy=false;

const bgm=$('bgm'),mu=$('mute');
$('open').onclick=()=>{i=-1;advance();bgm.volume=.7;bgm.play().then(()=>{mu.style.display='block'}).catch(()=>{})};
mu.onclick=()=>{bgm.muted=!bgm.muted;mu.textContent=bgm.muted?'🔇':'🔊'};
nextB.onclick=advance;

function advance(){
  if(busy)return;busy=true;nextB.classList.remove('on');
  stage.style.transition='opacity .5s';stage.style.opacity=0;
  setTimeout(()=>{
    i++;
    if(i>=slides.length){stage.style.display='none';nextB.style.display='none';$('ask').classList.add('show');return}
    const s=slides[i];
    stage.innerHTML=(s.d?'<p class="date">'+s.d+'</p>':'')+'<p class="line">'+s.t+'</p>';
    stage.style.opacity=1;
    setTimeout(()=>{busy=false;nextB.textContent=i===slides.length-1?'ada satu lagi':'lanjut';nextB.classList.add('on')},1400);
  },520);
}

// tombol "Mikir dulu" kabur
let tries=0;const no=$('no'),btns=$('btns');
const msgs=["Mikir dulu","Yakin?","Coba lagi deh","Beneran?","Klik yang satunya aja 🥺"];
function dodge(e){
  e.preventDefault();tries++;
  no.textContent=msgs[Math.min(tries,msgs.length-1)];
  no.style.position='fixed';
  const w=innerWidth-no.offsetWidth-24,h=innerHeight-no.offsetHeight-24;
  no.style.left=(12+Math.random()*w)+'px';
  no.style.top=(12+Math.random()*h)+'px';
  no.style.fontSize=Math.max(11,16-tries)+'px';
}
no.addEventListener('mouseenter',dodge);
no.addEventListener('touchstart',dodge,{passive:false});
no.addEventListener('click',dodge);

$('yes').onclick=()=>{
  $('ask').classList.remove('show');$('fin').classList.add('show');
  no.style.display='none';burst();
  const f=document.querySelector('#fin .polaroid'),g=document.createElement('div');g.className='strip';
  ['a','b','c','d'].forEach((k,n)=>{const p=document.createElement('figure');p.className='polaroid'+(n%2?'':' r');p.innerHTML='<img alt="" src="'+PH[k]+'">';g.appendChild(p)});
  f.classList.remove('r');g.appendChild(f);$('fin').appendChild(g);
  const h=document.createElement('p');h.className='swipe';h.textContent='geser ya, ini kita 🤍';$('fin').appendChild(h);
};

// hati melayang + confetti
const cv=$('c'),x=cv.getContext('2d');let W,H,dpr=Math.min(devicePixelRatio||1,2);
function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;x.setTransform(dpr,0,0,dpr,0,0)}
size();addEventListener('resize',size);
const cols=['#ff8aa8','#ffd0b0','#ff5a86','#ffe6ee','#c77dff'];
const mk=(fast)=>({x:Math.random()*W,y:fast?H*.55:H+20,s:6+Math.random()*16,v:fast?-(3+Math.random()*7):-(.25+Math.random()*.6),dx:(Math.random()-.5)*(fast?6:.5),a:Math.random()*6,c:cols[Math.random()*cols.length|0],g:fast?.1:0,life:fast?1:0});
let ps=Array.from({length:22},()=>{const p=mk(false);p.y=Math.random()*H;return p});
function heart(p){x.save();x.translate(p.x,p.y);x.rotate(Math.sin(p.a)*.4);x.scale(p.s/16,p.s/16);x.beginPath();x.moveTo(0,5);x.bezierCurveTo(-10,-3,-6,-12,0,-6);x.bezierCurveTo(6,-12,10,-3,0,5);x.fill();x.restore()}
function burst(){for(let k=0;k<120;k++){const p=mk(true);p.x=W/2;p.y=H*.55;p.dx=(Math.random()-.5)*14;p.v=-(2+Math.random()*10);ps.push(p)}}
function loop(){
  x.clearRect(0,0,W,H);
  ps.forEach(p=>{p.a+=.02;p.x+=p.dx+Math.sin(p.a)*.3;p.v+=p.g;p.y+=p.v;
    x.globalAlpha=p.g?Math.max(0,Math.min(1,(H-p.y+60)/H*1.4)):.28;x.fillStyle=p.c;heart(p)});
  ps=ps.filter(p=>p.y<H+40&&p.y>-60);
  while(ps.filter(p=>!p.g).length<22)ps.push(mk(false));
  requestAnimationFrame(loop);
}
if(!matchMedia('(prefers-reduced-motion:reduce)').matches)loop();
